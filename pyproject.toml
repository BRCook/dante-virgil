[project]
name = "dante-virgil"
version = "0.1.0"
description = "Virgil: PTPv2 clocking for Dante over wireless links."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.9",
    "netaudio==1.0.0",
    "tomli-w>=1.0",
    "zeroconf>=0.131",
]

[project.scripts]
virgilctl = "virgil.cli:main"
virgil-root = "virgil.rootctl:main"
virgild = "virgil.daemon:main"

# Virgil runs on Linux, on x86_64 or aarch64: the architectures netaudio's wheels are built for.
[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

# netaudio comes from Benjamin Cook's fork of Christopher Ritsen's network-audio-controller,
# as the prebuilt wheel for each architecture on the fork's GitHub release.
[tool.uv.sources]
netaudio = [
    { url = "https://github.com/BRCook/netaudio/releases/download/v1.0.0/netaudio-1.0.0-py3-none-manylinux_2_28_x86_64.whl", marker = "platform_machine == 'x86_64'" },
    { url = "https://github.com/BRCook/netaudio/releases/download/v1.0.0/netaudio-1.0.0-py3-none-manylinux_2_28_aarch64.whl", marker = "platform_machine == 'aarch64'" },
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/virgil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
