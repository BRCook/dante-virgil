[project]
name = "dante-virgil"
version = "0.1.0"
description = "Virgil: PTPv2 clocking for Dante over wireless links."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.9",
    "tomli-w>=1.0",
    "zeroconf>=0.131",
]

[project.scripts]
virgilctl = "virgil.cli:main"
virgil-root = "virgil.rootctl:main"
virgild = "virgil.daemon:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/virgil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
