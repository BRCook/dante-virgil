# Build Virgil's packages for amd64 and arm64, and publish them as a GitHub release, whenever a version is tagged
# (v1.0.0, say: the tag must match pyproject.toml's version). Run it by hand (Actions, "Release", "Run workflow")
# to build test packages, which are kept with the run to download, without releasing anything.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "The version to build, as pyproject.toml has it (nothing is released)"
        required: true

# By default, a job here can only read the repository. Building runs other people's code (pip, apt, the wheels'
# own build steps), so it gets nothing more; only the job that publishes the release may write (see below).
permissions:
  contents: read

jobs:
  # Nothing is built, let alone released, unless the tests pass.
  test:
    name: Test
    uses: ./.github/workflows/tests.yml

  build:
    name: Build (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Only what this job needs. id-token and attestations: to sign a statement of where each file came from.
    permissions:
      contents: read
      id-token: write
      attestations: write
    # Debian 13 itself, on each architecture, so the wheels downloaded are the ones the Clock Boxes need.
    container: debian:trixie
    steps:
      - name: Note what a bare Debian 13 has installed
        run: cp /var/lib/dpkg/status /tmp/bare-status
      - name: Install the build's own tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 python3-venv
      # Actions are pinned to a commit, not a tag: a tag can be moved to different code, a commit can't. (v7.0.1)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build the package and the offline bundle
        env:
          BARE_STATUS: /tmp/bare-status
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"
          packaging/build.sh "$version" dist
      # GitHub signs a statement that these exact files were built by this workflow, from this commit, in this
      # repository, which anyone can check: gh attestation verify <file> --repo BRCook/dante-virgil. Only for a
      # release, so test builds don't leave attestations behind.
      - name: Attest where the files came from
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dante-virgil-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # The only job that may write to the repository: it creates the release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: List each file's SHA-256, so a download can be checked (sha256sum -c SHA256SUMS)
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Virgil ${GITHUB_REF_NAME#v}" --generate-notes
