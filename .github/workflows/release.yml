# Build Virgil's packages for amd64 and arm64, and publish them as a GitHub release, whenever a version is tagged
# (v1.0.0, say: the tag must match pyproject.toml's version). Run it by hand (Actions, "Release", "Run workflow")
# to build test packages, which are kept with the run to download, without releasing anything.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "The version to build, as pyproject.toml has it (nothing is released)"
        required: true

# By default, a job here can only read the repository. Building runs other people's code (pip, apt, the wheels'
# own build steps), so it gets nothing more; only the job that publishes the release may write (see below).
permissions:
  contents: read

jobs:
  # Nothing is built, let alone released, unless the tests pass.
  test:
    name: Test
    uses: ./.github/workflows/tests.yml

  build:
    name: Build (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Debian 13 itself, on each architecture, so the wheels downloaded are the ones the Clock Boxes need.
    container: debian:trixie
    steps:
      - name: Note what a bare Debian 13 has installed
        run: cp /var/lib/dpkg/status /tmp/bare-status
      - name: Install the build's own tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 python3-venv
      # Actions are pinned to a commit, not a tag: a tag can be moved to different code, a commit can't. (v4.4.0)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build the package and the offline bundle
        env:
          BARE_STATUS: /tmp/bare-status
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"
          packaging/build.sh "$version" dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dante-virgil-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # The only job that may write to the repository: it creates the release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: List each file's SHA-256, so a download can be checked (sha256sum -c SHA256SUMS)
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Virgil ${GITHUB_REF_NAME#v}" --generate-notes
