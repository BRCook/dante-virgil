# The daemon's requests to virgil-root.
d /run/dante-virgil 0750 dante-virgil dante-virgil -
# virgil-root's generated configuration. Only root can write here.
d /run/dante-virgil-generated 0755 root root -
# What virgil-root has to remember across reboots (its probes of the NICs' transmit timestamp slots). Only root can
# write here either: root never writes in /var/lib/dante-virgil, which belongs to the dante-virgil user.
d /var/lib/dante-virgil-root 0755 root root -
